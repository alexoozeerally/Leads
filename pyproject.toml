[project]
name = "leadfinder"
version = "0.1.0"
description = "AI Web-Design Lead Finder — discovers UK businesses, audits their online presence, scores them as web-design prospects, and drafts outreach for human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
    "anthropic>=0.39",
    "streamlit>=1.39",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "greenlet>=3.1",
]

[project.scripts]
leadfinder = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI/Depends default-arg pattern

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "app/database/migrations/versions"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
